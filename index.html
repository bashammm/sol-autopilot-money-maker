    <script>
      // Shim to prevent multi-wallet extension collision ("Cannot redefine property: ethereum")
      (function() {
        try {
          let _eth = window.ethereum;
          Object.defineProperty(window, 'ethereum', {
            get() { return _eth; },
            set(v) { _eth = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Property already locked or non-configurable
        }
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('Cannot redefine property: ethereum')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        });
      })();
    </script>
